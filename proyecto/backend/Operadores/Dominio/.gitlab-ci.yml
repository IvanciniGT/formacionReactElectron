# Pipelines por rama. No hace falta MR: quien puede hacer push a dev o a main lo decide la
# protección de ramas. Lo que se garantiza es que nada se publica sin pasar sus pruebas.
#
#   push a feature/*   pruebas unitarias
#   push a dev         unitarias + integración + Sonar
#                      botón «publicar-desa» (manual)           → publica X.Y.Z-desa.N
#   push a main        unitarias + integración + sistema
#                      + versión y compatibilidad               → publica X.Y.Z-rc.N y su tag
#   botón «aceptar»    (manual, en el pipeline de main)         → publica X.Y.Z, su tag, la
#                                                                 Release y el CHANGELOG
#
# La versión no la escribe nadie: la calcula .gitlab/version.sh a partir del último tag
# final y de lo que hay en Unreleased en CHANGELOG.md. Los tags los pone el pipeline y solo
# en main, que no se reescribe: en feature/* y en dev se puede hacer rebase y reset.
workflow:
  rules:
    # Los tags los crea el propio pipeline al publicar: no vuelven a lanzar nada.
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Una rama con MR abierta ya tiene el pipeline de la MR: no se duplica.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != "dev" && $CI_COMMIT_BRANCH != "main"
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  SOLUCION: Operadores.Dominio.slnx
  PROYECTO_PAQUETE: src/Operadores.Dominio/Operadores.Dominio.csproj
  SONAR_PROJECT_KEY: ivan_operadores-dominio
  NUGET_PACKAGES: ${CI_PROJECT_DIR}/.nuget/packages
  # La versión se calcula con los tags: hace falta el historial completo.
  GIT_DEPTH: "0"

include:
  - local: .gitlab/pruebas.yml
  - local: .gitlab/publicacion.yml

stages:
  - pruebas
  - calidad
  - publicacion
  - aceptacion

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key: nuget
    paths:
      - .nuget/packages/
  before_script:
    # Los paquetes propios se bajan del registro NuGet del grupo. nuget.config declara el
    # origen sin credenciales; aquí se le añaden las del job, solo dentro de este clon.
    - dotnet nuget update source gitlab-apuestas --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text --configfile nuget.config
    - dotnet restore "$SOLUCION"
