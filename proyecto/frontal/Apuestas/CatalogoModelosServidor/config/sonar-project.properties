# Análisis en tu SonarQube. El token NO va aquí: el scanner lo lee de la variable de
# entorno SONAR_TOKEN (en local: SONAR_TOKEN=… npm run sonar; en el pipeline, la variable
# del grupo).
sonar.host.url=https://sonarqube.ivanosuna.com
sonar.projectKey=ivan_catalogo-modelos-servidor
sonar.projectName=catalogo-modelos-servidor
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/sistema/**/*.ts
sonar.exclusions=dist/**,artifacts/**,node_modules/**

# c8 deja aquí la cobertura (npm run cobertura, antes de npm run sonar).
sonar.javascript.lcov.reportPaths=artifacts/cobertura/lcov.info

# «todo» en castellano no es un TODO: Sonar lee la palabra y pide completar una tarea que
# no existe. Se ignora la regla, no el comentario. Igual que en los proyectos de node.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts
